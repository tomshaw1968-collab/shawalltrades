<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scottish Snooker Live</title>
<link rel="icon" type="image/png" id="favicon">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#16202c;background:#eef1f5;-webkit-text-size-adjust:100%}
.nar{font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-weight:700}
.ball{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.9) 0 .08em,transparent .14em),var(--b);box-shadow:inset -.1em -.15em .2em rgba(0,0,0,.35);vertical-align:-.05em;margin-right:.3em}
.live{display:inline-flex;align-items:center;gap:6px;font:700 .72rem system-ui,sans-serif;letter-spacing:.08em;color:#fff;background:#c8102e;border-radius:99px;padding:3px 9px}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.done-tag{display:inline-block;font:700 .72rem system-ui,sans-serif;letter-spacing:.08em;color:#fff;background:#1f6b3a;border-radius:99px;padding:3px 9px}
.ip{font:700 .7rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#c8102e;border:1.5px solid #c8102e;border-radius:99px;padding:2px 8px;white-space:nowrap}
.ip.st{color:#5a6676;border-color:#5a6676}
.century{font:700 .6rem system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:#fff1c2;color:#8a6100;border:1px solid #e0b000;margin-left:6px;vertical-align:middle;white-space:nowrap}
.century.max{background:linear-gradient(90deg,#b8860b,#f6d365,#b8860b);color:#2a1a00;border-color:#b8860b}
table.lg{border-collapse:collapse;width:100%}
table.lg th{font:600 .66rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#5a6676;text-align:left;padding:5px 6px;background:#f3f5f8}
table.lg td{padding:6px;border-top:1px solid #e3e7ee}
table.lg .n{text-align:right}
table.lg tr.q td{background:#e3efe6}
table.lg tr.q td:first-child{box-shadow:inset 3px 0 #1f6b3a}

/* ---------- phone / computer ---------- */
#phone{max-width:640px;margin:0 auto}
.top{background:#14325e;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.top img{width:42px;height:42px;border-radius:50%;background:#fff;flex:none}
.top b{font-size:1.2rem;display:block}
.top small{opacity:.8;font-size:.8rem}
.ev{background:#fff;margin:10px;border-radius:12px;border:1px solid #d3d9e2;overflow:hidden}
.evh{padding:12px 14px;border-top:5px solid var(--c,#151515)}
.evh h2{font-size:1.25rem;margin:6px 0 2px}
.evh p{margin:0;color:#5a6676;font-size:.86rem}
.tabs{display:flex;border-top:1px solid #e3e7ee;border-bottom:1px solid #e3e7ee;overflow-x:auto}
.tabs button{flex:1 0 auto;background:none;border:0;padding:10px 7px;font:600 .7rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;color:#5a6676;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#14325e;box-shadow:inset 0 -3px #14325e}
.sec{padding:12px 14px 4px;font:700 .74rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#5a6676}
.tb{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #eef1f5}
.tno{font:700 .74rem system-ui,sans-serif;color:#fff;background:#1f6b3a;border-radius:6px;padding:4px 7px;min-width:64px;text-align:center;flex:none}
.tno.free{background:#9aa3af}
.tb .m{flex:1;font-size:.93rem;min-width:0}
.tb .m small{display:block;color:#5a6676;font-size:.76rem}
.nx{padding:2px 14px 12px;font-size:.88rem;line-height:1.6}
.gwrap{padding:0 8px 12px}
.gwrap h3{font-size:.95rem;margin:12px 6px 4px}
.res{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid #eef1f5;font-size:.92rem}
.res small{display:block;color:#5a6676;font-size:.74rem}
.res .sc{font-size:1.15rem;white-space:nowrap}
.res .w{font-weight:700}
.rounds{display:flex;gap:6px;padding:10px 14px 4px;overflow-x:auto}
.rounds button{font:600 .78rem system-ui,sans-serif;border:1px solid #d3d9e2;background:#fff;border-radius:99px;padding:5px 11px;white-space:nowrap;color:#16202c;cursor:pointer}
.rounds button[aria-selected="true"]{background:#14325e;border-color:#14325e;color:#fff}
.mt{margin:8px 14px;border:1px solid #e3e7ee;border-radius:10px;overflow:hidden}
.mt.play{border-color:#c8102e;box-shadow:0 0 0 1px #c8102e}
.mh{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:#f3f5f8}
.mh small{font-size:.76rem;color:#5a6676;font-weight:600}
.fin{font:700 .66rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#5a6676}
.pl{display:flex;justify-content:space-between;padding:7px 10px;border-top:1px solid #eef1f5;font-size:.95rem;background:#fff}
.pl b{font-size:1.1rem;min-width:1.2em;text-align:right}
.pl.w span{font-weight:700}.pl.w b{color:#1f6b3a}
.mt.done .pl:not(.w) span{color:#5a6676}
.mt.tbc .pl span{color:#5a6676;font-style:italic}
.winner{margin:12px 14px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#fff7d6,#ffe9a8);border:2px solid #e0b000;text-align:center}
.winner b{display:block;font-size:1.5rem;margin:2px 0}
.winner span{font-size:.88rem;color:#5a3d00}
.up{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid #eef1f5}
.up:first-of-type{border-top:0}
.up b{font-size:1rem}.up small{display:block;color:#5a6676;font-size:.82rem}
.pagebar{background:#fff;padding:10px 12px;border-bottom:1px solid #e3e7ee;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(20,50,94,.08)}
.pagebar p{margin:0;font:600 .82rem system-ui,sans-serif;color:#14325e}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pills button{border:0;border-radius:99px;padding:6px 11px;font:600 .78rem system-ui,sans-serif;background:#eef1f6;color:#14325e;cursor:pointer}
.pills button[aria-pressed="true"]{background:#14325e;color:#fff}
.foot{text-align:center;color:#5a6676;font-size:.8rem;padding:10px 12px 22px;line-height:1.5}
.empty{padding:14px;color:#5a6676;font-style:italic}

/* ---------- TV (designed at 1920 x 1080, scaled to fit) ---------- */
#tvbox{position:fixed;inset:0;background:#0b1f3a;overflow:hidden}
#tv{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#fff}
#tv .hd{display:flex;align-items:center;gap:22px;padding:20px 40px;background:#14325e;height:128px}
#tv .hd img{width:84px;height:84px;border-radius:50%;background:#fff}
#tv .hd h1{font-size:46px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1500px}
#tv .hd p{margin:2px 0 0;font-size:22px;opacity:.85}
#tv .hd .live,#tv .hd .done-tag{font-size:18px;padding:6px 16px;margin-left:auto}
#tv .grid{display:grid;grid-template-columns:1.05fr 1.6fr .95fr;gap:24px;padding:22px 40px;height:890px}
#tv .card{background:#fff;color:#16202c;border-radius:16px;padding:16px 20px;overflow:hidden}
#tv .card h2{font-size:25px;margin:0 0 8px;color:#14325e;text-transform:uppercase;letter-spacing:.04em}
#tv .ttb{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #e3e7ee;font-size:20px;line-height:1.2}
#tv .ttb .tno{font-size:16px;padding:5px 8px;min-width:88px}
#tv .ttb .m{flex:1;min-width:0}
#tv .ttb small{display:block;font-size:14px;color:#5a6676}
#tv .ip{font-size:14px}
#tv .gg{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
#tv .gg h3{margin:0 0 4px;font-size:19px}
#tv .gg table.lg{font-size:17px}
#tv .gg table.lg td{padding:4px 6px}
#tv .gg table.lg th{font-size:11px;padding:3px 6px}
#tv .rr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #e3e7ee;font-size:19px}
#tv .rr small{display:block;font-size:13px;color:#5a6676}
#tv .rr .sc{font-size:23px;white-space:nowrap}
#tv .hb{margin-top:16px;background:#fff1c2;border:2px solid #e0b000;border-radius:12px;padding:12px 16px;font-size:21px;text-align:center;color:#16202c}
#tv .hb b{display:block;font-size:46px}
#tv .note5{position:absolute;left:40px;right:40px;bottom:14px;font-size:20px;color:#c9d6ea;text-align:center}
#tv .kwrap{display:grid;grid-template-columns:1fr 380px;gap:24px;padding:22px 40px;height:890px}
#tv .br{background:#fff;color:#16202c;border-radius:16px;padding:14px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
#tv .col{display:flex;flex-direction:column;justify-content:space-around}
#tv .col h2{font-size:22px;color:#14325e;text-transform:uppercase;margin:0;letter-spacing:.04em}
#tv .lab{margin:0 0 3px;font:700 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#5a6676;height:16px}
#tv .lab.play{color:#c8102e}
#tv .bx{border:1px solid #d3d9e2;border-radius:10px;overflow:hidden;font-size:18px}
#tv .bx div{display:flex;justify-content:space-between;padding:4px 10px}
#tv .bx div+div{border-top:1px solid #eef1f5}
#tv .bx b{font-size:21px}
#tv .bx .w{background:#e3efe6;font-weight:700}
#tv .bx .w b{color:#1f6b3a}
#tv .bx.play{border:3px solid #c8102e}
#tv .bx.tbc{border-style:dashed;color:#5a6676}
#tv .side{display:flex;flex-direction:column;gap:20px}
#tv .champ{background:linear-gradient(135deg,#fff7d6,#ffe9a8);border:3px solid #e0b000;border-radius:16px;padding:18px;text-align:center;color:#3a2a00}
#tv .champ b{display:block;font-size:44px;margin:4px 0}
#tv .champ span{font-size:20px}

/* players, notes */
.sumline{padding:12px 14px 0;font-size:.95rem}.sumline b{font-size:1.02rem}.sumline .sub{color:#5a6676;font-size:.85rem}
.pgrp{padding:4px 14px 10px}.pgrp h4{margin:10px 0 6px;font:700 .8rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center}
.pgrp h4 .cnt,#tv .cnt{font:700 .72rem system-ui,sans-serif;border-radius:99px;padding:1px 8px;color:#fff;background:#1f6b3a}
.pgrp.h-coming h4 .cnt{background:#1d4f91}.pgrp.h-not h4 .cnt{background:#a8461c}.pgrp.h-wd h4 .cnt,.pgrp.h-ns h4 .cnt{background:#5a6676}
.names{columns:2;column-gap:16px;font-size:.92rem;line-height:1.75}.names span{display:block;break-inside:avoid}
.names.dim span,#tv .dim span{color:#5a6676}.names.strike span,#tv .strike span{color:#8a94a3;text-decoration:line-through}
.stale{margin:8px 0 0;padding:6px 10px;border-radius:8px;background:#fbe9e0;color:#a8461c;font-size:.84rem;font-weight:600}
.evfoot{margin:0;padding:8px 14px 10px;color:#5a6676;font-size:.76rem;border-top:1px solid #eef1f5}
#tv .pwrap{display:grid;grid-template-columns:1fr 440px;gap:24px;padding:22px 40px;height:890px}
#tv .tvbar{display:flex;align-items:center;gap:12px;padding:0 40px;height:64px;background:#fff;color:#14325e;font:600 22px system-ui,sans-serif}
#tv .tvbar .upd{margin-right:10px}
#tv .tvbar button{border:0;border-radius:99px;padding:8px 20px;font:600 22px system-ui,sans-serif;background:#eef1f6;color:#14325e;cursor:pointer}
#tv .tvbar button[aria-pressed="true"]{background:#14325e;color:#fff}
#tv .tvbar .hint{margin-left:auto;font-weight:400;color:#5a6676}
#tv.withbar .grid,#tv.withbar .pwrap,#tv.withbar .kwrap{height:826px}
#tv .pwrap h2{display:flex;gap:12px;align-items:center}#tv .cnt{font-size:18px;padding:2px 12px}
#tv .big{columns:3;column-gap:30px;font-size:26px;line-height:1.7}#tv .big span{display:block}
#tv .drawnext{font:700 34px "Arial Narrow",Arial,sans-serif;color:#14325e;text-align:center;margin-top:30px}
</style>
</head>

const STORE_DEFAULT = "https://snooker-live.tom-shaw1968.workers.dev";
const QS = new URLSearchParams(location.search);
const DEMO = QS.has("demo") || !/^https?:/.test(QS.get("store") || STORE_DEFAULT);
const STORE = (QS.get("store") || STORE_DEFAULT).replace(/\/+$/, "");
const POLL_MS = 30000;                          // check for news every 30 seconds
const SLOT_MS = 20000;                          // a new address every 20 seconds, so the store's cached copy is at most that old
const BALL = { "main-tour":"#1f8a3c", masters:"#151515", seniors:"#1e5bd8", womens:"#ec6fa0", billiards:"#f4f1e6", u21:"#f6d32d", u18:"#7b4a1e", u14:"#c8102e", sotf:"#c8102e" };
const NOTE = "Updated every few minutes · final scores only";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
function ukDate(when = new Date()){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{ timeZone:"Europe/London", year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(when).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const longDay = d => d ? new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}) : "";
const hhmm = t => t ? new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"}) : "";
const badge = v => v===147 ? `<span class="century max">Maximum</span>` : v>=100 ? `<span class="century">Century</span>` : "";
const surname = n => { const w = String(n).trim().split(/\s+/); return (w.length>1 ? w[w.length-1]+" "+w.slice(0,-1).join(" ") : w[0]).toLowerCase(); };
const bySurname = l => (l||[]).slice().sort((a,b)=>surname(a).localeCompare(surname(b),"en-GB"));
const scoreText = r => r.wo ? "w/o" : `${r.sa}–${r.sb}`;
const finalText = w => w && w.score ? ` ${w.score}` : "";
const kindName0 = e => e.kind==="qualifying" ? "Qualifying" : e.kind==="finals" ? "Finals" : e.stage==="knockout"||e.stage==="finished" ? "Knockout" : "Groups";
// "Masters Event 2 · Knockout", but just "Main Tour qualifying" when the name already says what kind it is
const evTitle = e => { const k = kindName0(e), n = String(e.name||""); return n.toLowerCase().includes(k.toLowerCase().replace(/s$/,"")) ? esc(n) : `${esc(n)} · ${k}`; };

/* ---------- getting the day's events ---------- */
let events = [], lastOk = null, lastErr = "", fetching = false;
async function load(){
  if (DEMO){ events = [demoMessage(Date.now())]; lastOk = Date.now(); lastErr = ""; return; }
  if (fetching) return; fetching = true;
  try{
    const r = await fetch(`${STORE}/day/${ukDate()}?b=${Math.floor(Date.now()/SLOT_MS)}`, { cache:"no-store" });
    const d = await r.json(); if (!d.ok) throw new Error(d.error || "no results");
    events = d.events || []; lastOk = Date.now(); lastErr = "";
  }catch(e){ lastErr = "Can't reach the results just now. Trying again shortly."; }
  finally{ fetching = false; }
}

/* ---------- phone / computer ---------- */
const view = {};       // per event: { tab, round, chosen }
function tabsFor(m){
  const t = [["players",`Players (${["here","coming","notHere"].reduce((n,k)=>n+(m.players?.[k]?.length||0),0)})`]];
  if (m.knockout) t.push(["ko", m.event.kind==="finals" ? "Draw" : "Knockout"]);
  if (m.event.stage!=="entries" && m.event.stage!=="finished") t.push(["tables","Tables"]);
  if ((m.groups||[]).length) t.push(["groups","Groups"]);
  if (m.event.stage!=="entries"){ t.push(["results","Results"]); t.push(["breaks","Breaks"]); }
  return t;
}
function defaultTab(m){ const s = m.event.stage; return s==="entries" ? "players" : m.knockout && (s==="knockout"||s==="finished") ? "ko" : s==="finished" ? "groups" : "tables"; }
function playersHtml(m){
  const P = m.players || {}, parts = [["here","Here","h-here",""],["coming","On their way","h-coming","dim"],["notHere","Not here yet","h-not","dim"],["withdrawn","Withdrawn","h-wd","strike"],["noShow","No show","h-ns","strike"]].filter(x=>(P[x[0]]||[]).length);
  if (!parts.length) return `<p class="empty">No players entered yet.</p>`;
  const sum = parts.map(([k,l])=>`${P[k].length} ${l.toLowerCase()}`).join(" · ");
  return `<div class="sumline"><b>${sum}</b>${m.event.stage==="entries" ? `<br><span class="sub">Players arriving. The ${m.event.kind==="finals" ? "draw" : "groups"} appear${m.event.kind==="finals"?"s":""} here once the draw is made.</span>` : ""}</div>
    ${parts.map(([k,l,c,d])=>`<div class="pgrp ${c}"><h4>${l} <span class="cnt">${P[k].length}</span></h4><div class="names ${d}">${bySurname(P[k]).map(n=>`<span>${esc(n)}</span>`).join("")}</div></div>`).join("")}`;
}
function leagueTable(rows){
  return `<table class="lg"><thead><tr><th>#</th><th>Player</th><th class="n">P</th><th class="n">W</th><th class="n">Pts</th><th class="n">f/d</th></tr></thead><tbody>${(rows||[]).map(r=>
    `<tr class="${r.q?"q":""}"><td>${r.pos??""}</td><td><b>${esc(r.name)}</b></td><td class="n">${r.p}</td><td class="n">${r.w}</td><td class="n"><b>${r.pts}</b></td><td class="n">${r.fd>0?"+":""}${r.fd}</td></tr>`).join("")}</tbody></table>`;
}
function koMatchPhone(x){
  const a = x.a || x.aFrom || "", b = x.b || x.bFrom || "", known = !!(x.a && x.b), st = x.status;
  const tag = st==="play" ? `<span class="ip" style="font-size:.66rem">In play</span>` : st==="done" ? `<span class="fin">Finished</span>` : `<span class="fin">${known ? "Next" : "To come"}</span>`;
  const where = x.table ? `${esc(x.table)}${st==="wait" ? " · next" : ""}` : "";
  const sc = side => st==="done" && !x.wo ? (side==="a" ? x.sa : x.sb) : st==="done" && x.wo ? (x.winner===(side==="a"?x.a:x.b) ? "w/o" : "") : "";
  return `<div class="mt ${st} ${known?"":"tbc"}"><div class="mh">${tag}<small>${where}</small></div>
    <div class="pl ${st==="done"&&x.winner===x.a?"w":""}"><span>${esc(a)}</span><b class="nar">${sc("a")}</b></div><div class="pl ${st==="done"&&x.winner===x.b?"w":""}"><span>${esc(b)}</span><b class="nar">${sc("b")}</b></div></div>`;
}
function eventCardPhone(m){
  const e = m.event, v = view[e.id] ||= { tab:null, round:null, chosen:false, roundChosen:false }, tabs = tabsFor(m);
  if (!v.chosen || !tabs.some(t=>t[0]===v.tab)) v.tab = defaultTab(m);
  const colour = BALL[e.comp] || "#14325e", over = e.stage==="finished";
  let body = "";
  if (v.tab==="players") body = playersHtml(m);
  if (v.tab==="tables"){
    body = `<div class="sec">On the tables now</div>${(m.tables||[]).length ? m.tables.map(t=>`<div class="tb"><span class="tno ${t.status==="free"?"free":""}">${esc(t.label)}</span>
      ${t.status==="play" ? `<div class="m"><b>${esc(t.a)}</b> v <b>${esc(t.b)}</b><small>${esc(t.stage)}</small></div><span class="ip">In play</span>` : `<div class="m"><small>Free</small></div>`}</div>`).join("") : `<p class="empty">No matches on yet.</p>`}
      <div class="sec">Next up</div><div class="nx">${(m.next||[]).slice(0,4).map(n=>`${esc(n.a)} v ${esc(n.b)} · ${esc(n.stage)}${n.table?` · ${esc(n.table)}`:""}`).join("<br>") || "Waiting for the next matches."}</div>`;
  }
  if (v.tab==="groups") body = `<div class="gwrap">${m.groups.map(g=>`<h3>Group ${esc(g.letter)}${g.done?` <span class="fin" style="margin-left:6px">Finished</span>`:""}</h3>${leagueTable(g.rows)}`).join("")}
      <p class="foot" style="padding-bottom:4px">2 points for a win. Green: in a qualifying place.</p></div>`;
  if (v.tab==="results") body = (m.results||[]).length ? m.results.map(r=>`<div class="res"><div><span class="${r.winner===r.a?"w":""}">${esc(r.a)}</span> v <span class="${r.winner===r.b?"w":""}">${esc(r.b)}</span><small>${esc(r.stage)}</small></div><b class="sc nar">${scoreText(r)}</b></div>`).join("")
      : `<p class="empty">No results yet.</p>`;
  if (v.tab==="breaks") body = (m.breaks||[]).length ? m.breaks.map(b=>`<div class="res"><div><b>${esc(b.player)}</b> v ${esc(b.opponent)}<small>${esc(b.stage)}</small></div><b class="sc nar">${b.value}${badge(b.value)}</b></div>`).join("")
      : `<p class="empty">No breaks of 40 or more yet.</p>`;
  if (v.tab==="ko"){
    const rounds = m.knockout.rounds || [], cur = rounds.findIndex(r=>r.matches.some(x=>x.status!=="done"));
    if (!v.roundChosen || v.round==null || v.round>=rounds.length) v.round = cur<0 ? rounds.length-1 : cur;
    body = `${m.winner ? `<div class="winner">Winner<b>${esc(m.winner.name)}</b><span>beat ${esc(m.winner.runnerUp)}${finalText(m.winner)} in the final</span></div>` : ""}
      <div class="rounds">${rounds.map((r,i)=>`<button data-ev="${esc(e.id)}" data-round="${i}" aria-selected="${i===v.round}" type="button">${esc(r.name)}</button>`).join("")}</div>
      ${(rounds[v.round]?.matches||[]).map(koMatchPhone).join("")}`;
  }
  const stale = !over && m.sent && Date.now() - Date.parse(m.sent) > 20*60000;
  return `<div class="ev" id="ev-${esc(e.id)}" style="--c:${colour}"><div class="evh">${over ? `<span class="done-tag">FINISHED</span>` : `<span class="live">LIVE${m.sent ? ` · last result ${hhmm(m.sent)}` : ""}</span>`}
      <h2><span class="ball" style="--b:${colour}"></span>${evTitle(e)}</h2>
      <p>${esc(e.venue)} · ${longDay(e.date)}${e.td?` · TD ${esc(e.td)}`:""}</p>
      ${over && !m.knockout && (m.groups||[]).length ? `<p style="margin-top:6px;color:#1f6b3a;font-weight:600">Finished: the qualifiers are in green on the Groups tab.</p>` : ""}
      ${stale ? `<p class="stale">Waiting for the venue's next update (last ${hhmm(m.sent)}).</p>` : ""}</div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button data-ev="${esc(e.id)}" data-tab="${k}" role="tab" aria-selected="${k===v.tab}" type="button">${l}</button>`).join("")}</div>
    ${body}<p class="evfoot">Last result ${hhmm(m.sent)}</p></div>`;
}
// A short name for each event's button: the venue, or the event's name when two are at the same venue
const pillName = (m, all) => { const v = String(m.event.venue||"").split(",")[0].trim(); return all.filter(x=>String(x.event.venue||"").split(",")[0].trim()===v).length>1 || !v ? `${m.event.name}${v ? " · " + v : ""}` : v; };
let picked = null;
function renderPhone(){
  const latest = events.map(m=>m.sent).filter(Boolean).sort().pop();
  if (!events.some(m=>m.event.id===picked)) picked = events[0]?.event.id || null;
  const bar = lastOk ? `<div class="pagebar"><p>Page updated ${hhmm(lastOk)}${events.length>1 ? ` · ${events.length} events on today` : ""}</p>
    ${events.length>1 ? `<div class="pills">${events.map(m=>`<button type="button" data-jump="${esc(m.event.id)}" aria-pressed="${m.event.id===picked}">${esc(pillName(m, events))}</button>`).join("")}</div>` : ""}</div>` : "";
  $("phone").innerHTML = `<div class="top"><img src="${LOGO}" alt=""><div><b>Scottish Snooker Live</b><small>Results through the day</small></div></div>
    ${bar}
    ${lastErr ? `<p class="stale" style="margin:10px">${esc(lastErr)}</p>` : ""}
    ${events.length ? events.map(eventCardPhone).join("") : lastOk ? `<div class="ev"><p class="empty" style="font-style:normal">No Scottish Snooker events have sent results today. On event days, results appear here as the day goes on.</p></div>` : `<p class="empty">Loading…</p>`}
    <div class="foot"><b>${NOTE}</b><br>${latest ? `Last update ${hhmm(latest)} · ` : ""}the page refreshes by itself
      ${DEMO ? `<br><span style="opacity:.75">Demo: the players and results are pretend.</span>` : ""}</div>`;
}

/* ---------- TV (designed at 1920 x 1080, scaled to fit) ---------- */
let tvIndex = 0, tvTurn = Date.now(), tvPick = null;
function renderTV(){
  let list = events; const venue = QS.get("venue");
  if (venue) list = list.filter(m=>String(m.event.venue).toLowerCase().includes(venue.toLowerCase()));
  if (!list.length){
    $("tv").classList.remove("withbar");
    $("tv").innerHTML = `<div class="hd"><img src="${LOGO}" alt=""><div><h1>Scottish Snooker Live</h1><p>${longDay(ukDate())}</p></div></div>
      <div class="grid" style="grid-template-columns:1fr"><div class="card" style="display:flex;align-items:center;justify-content:center;font-size:34px;color:#5a6676;text-align:center">${lastErr ? esc(lastErr) : "No results have been sent yet today.<br>They will appear here as the day goes on."}</div></div>
      <div class="note5"><b>${NOTE}</b></div>`;
    return;
  }
  // several events: tap a venue button to switch (with ?rotate, take turns, 30 seconds each)
  if (QS.has("rotate")){ if (Date.now() - tvTurn > 30000){ tvIndex++; tvTurn = Date.now(); } tvPick = list[tvIndex % list.length].event.id; }
  if (!list.some(x=>x.event.id===tvPick)) tvPick = list[0].event.id;
  const m = list.find(x=>x.event.id===tvPick), e = m.event, colour = BALL[e.comp] || "#14325e", over = e.stage==="finished";
  const bar = `<div class="tvbar"><span class="upd">Page updated ${hhmm(lastOk)}</span>${list.length>1 && !QS.has("rotate") ? list.map(x=>`<button type="button" data-tvpick="${esc(x.event.id)}" aria-pressed="${x.event.id===tvPick}">${esc(pillName(x, list))}</button>`).join("") + `<span class="hint">Tap a venue to switch</span>` : ""}</div>`;
  const head = `<div class="hd"><img src="${LOGO}" alt=""><div><h1><span class="ball" style="--b:${colour}"></span>${evTitle(e)}</h1>
    <p>${esc(e.venue)} · ${longDay(e.date)} · Scottish Snooker Live</p></div>${over ? `<span class="done-tag">FINISHED</span>` : `<span class="live">LIVE${m.sent ? ` · last result ${hhmm(m.sent)}` : ""}</span>`}</div>${bar}`;
  const foot = `<div class="note5"><b>${NOTE}</b> · last result ${hhmm(m.sent)}${DEMO ? ` · <span style="opacity:.7">demo: pretend players and results</span>` : ""}</div>`;
  const hb = m.breaks?.[0] ? `<div class="hb">Highest break today<b class="nar">${m.breaks[0].value}</b>${esc(m.breaks[0].player)}${badge(m.breaks[0].value)}</div>` : "";
  const tablesCard = n => `<div class="card"><h2 class="nar">On the tables</h2>${(m.tables||[]).filter(t=>t.status==="play").slice(0,n).map(t=>`<div class="ttb"><span class="tno">${esc(t.label)}</span><div class="m"><b>${esc(t.a)}</b><br><b>${esc(t.b)}</b><small>${esc(t.stage)}</small></div><span class="ip">In play</span></div>`).join("")
    || `<p style="font-size:20px;color:#5a6676">${over ? "All matches have been played." : "No matches on just now."}</p>`}
    ${!over && (m.next||[]).length ? `<h2 class="nar" style="margin-top:14px">Next up</h2><div style="font-size:19px;line-height:1.55">${m.next.slice(0, n>6 ? 2 : 3).map(x=>`${esc(x.a)} v ${esc(x.b)}`).join("<br>")}</div>` : ""}</div>`;
  let html;
  if (e.stage==="entries"){
    const P = m.players || {}, side = [["coming","On their way","#1d4f91"],["notHere","Not here yet","#a8461c"],["withdrawn","Withdrawn","#5a6676"],["noShow","No show","#5a6676"]].filter(x=>(P[x[0]]||[]).length);
    html = `${head}<div class="pwrap"><div class="card"><h2 class="nar">Players here <span class="cnt">${(P.here||[]).length}</span></h2><div class="big">${bySurname(P.here).map(n=>`<span>${esc(n)}</span>`).join("")}</div></div>
      <div class="card">${side.map(([k,l,c])=>`<h2 class="nar">${l} <span class="cnt" style="background:${c}">${P[k].length}</span></h2><div class="big dim ${k==="withdrawn"||k==="noShow"?"strike":""}" style="columns:1;margin-bottom:14px">${bySurname(P[k]).map(n=>`<span>${esc(n)}</span>`).join("")}</div>`).join("")}
      <div class="drawnext">Draw to come</div><p style="text-align:center;font-size:20px;color:#5a6676">The ${e.kind==="finals" ? "draw appears" : "groups appear"} here once the draw is made.</p></div></div>${foot}`;
  } else if (!m.knockout || (e.stage==="groups" && (m.groups||[]).length)){
    const n = (m.groups||[]).length, cols = n>6 ? 3 : 2;
    html = `${head}<div class="grid">${tablesCard(8)}
      <div class="card"><h2 class="nar">Groups</h2><div class="gg" style="grid-template-columns:repeat(${cols},1fr)">${(m.groups||[]).map(g=>`<div><h3 class="nar">Group ${esc(g.letter)}</h3>${leagueTable(g.rows)}</div>`).join("")}</div></div>
      <div class="card"><h2 class="nar">Latest results</h2>${(m.results||[]).slice(0,9).map(r=>`<div class="rr"><span>${esc(r.a)} v ${esc(r.b)}<small>${esc(r.stage)}</small></span><b class="sc nar">${scoreText(r)}</b></div>`).join("") || `<p style="font-size:20px;color:#5a6676">No results yet.</p>`}${hb}</div></div>${foot}`;
  } else {
    // the bracket: the last rounds that halve each time (a preliminary round is left to the phone page)
    let rounds = m.knockout.rounds || [];
    while (rounds.length>1 && rounds[0].matches.length !== rounds[1].matches.length*2) rounds = rounds.slice(1);
    rounds = rounds.slice(-5);
    const most = Math.max(...rounds.map(r=>r.matches.length)), fs = most>8 ? 15 : 18;
    const box = x => { const st = x.status, known = !!(x.a && x.b), wa = st==="done" && x.winner===x.a, wb = st==="done" && x.winner===x.b;
      const lab = st==="play" ? `${esc(x.table||"")} · in play` : st==="wait" && known && x.table ? `${esc(x.table)} · next` : "";
      const sc = side => st!=="done" ? "" : x.wo ? ((side==="a"?wa:wb) ? "w/o" : "") : (side==="a" ? x.sa : x.sb);
      return `<div><p class="lab ${st}" style="${most>8?"height:12px;font-size:11px;margin:0 0 1px":""}">${lab}</p><div class="bx ${st} ${known?"":"tbc"}" style="font-size:${fs}px"><div class="${wa?"w":""}"><span>${esc(x.a||x.aFrom||"")}</span><b class="nar">${sc("a")}</b></div><div class="${wb?"w":""}"><span>${esc(x.b||x.bFrom||"")}</span><b class="nar">${sc("b")}</b></div></div></div>`; };
    html = `${head}<div class="kwrap"><div class="br" style="grid-template-columns:repeat(${rounds.length},1fr)">${rounds.map(r=>`<div class="col"><h2 class="nar">${esc(r.name)}</h2>${r.matches.map(box).join("")}</div>`).join("")}</div>
      <div class="side">${m.winner ? `<div class="champ">Winner<b class="nar">${esc(m.winner.name)}</b><span>beat ${esc(m.winner.runnerUp)}${finalText(m.winner)} in the final</span></div>` : tablesCard(5)}${hb}</div></div>${foot}`;
  }
  $("tv").classList.add("withbar");
  $("tv").innerHTML = html;
}

/* ---------- ?demo: a pretend Masters day, made into the same message the Tour Manager sends ----------
   Everyone who opens the demo at the same moment sees the same thing; it moves on every 5 minutes (20 seconds with
   ?speed=fast). A pretend day is 20 updates: the players arriving, the groups, the knockout, then the result. */
const DEMO_STEP_MS = QS.get("speed")==="fast" ? 20000 : 300000;
const DEMO_STEPS = 20, DEMO_PLAY = DEMO_STEPS - 3;
const DEMO_NAMES = ["Jim Smith","Alan Kerr","Neil Paterson","Paul Devlin","Gary Smith","Ross Coyle","Stephen Rae","Kevin Smiley","Iain Quinn","Scott Kerr",
  "Barry Reid","Callum Watt","Mark Boyle","Craig Murray","Euan Munro","Fraser Nicol","Darren Young","Gordon Baird","Hamish Lamont","Jamie Kelly",
  "Kenny Boyle","Lewis Hendry","Malcolm Irvine","Owen Shields","Stuart Drummond","Tony Gallacher","Craig Jardine","Kyle Ogilvie","Liam Rafferty","David Wilson"];
const DEMO_TABLES = [5,6,7,8,9,10,11,12], DEMO_START = 10*60;
const KO_NAME = { 16:"Last 16", 8:"Quarter-finals", 4:"Semi-finals", 2:"Final" }, KO_ONE = { 16:"Last 16", 8:"Quarter-final", 4:"Semi-final", 2:"Final" };
function rng(seed){ let s = (seed*2654435761 ^ 0x9e3779b9)>>>0 || 1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function shuffle(a, R){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function demoLeague(g, matches, T){
  const rows = Object.fromEntries(g.players.map(n=>[n,{ name:n, group:g.letter, p:0, w:0, l:0, pts:0, fw:0, fl:0, fd:0 }]));
  matches.filter(m=>m.stage==="G" && m.group===g.letter && m.end<=T).forEach(m=>{
    const A = rows[m.a], B = rows[m.b]; A.p++; B.p++; A.fw+=m.sa; A.fl+=m.sb; B.fw+=m.sb; B.fl+=m.sa;
    if (m.sa>m.sb){ A.w++; B.l++; A.pts+=2; } else { B.w++; A.l++; B.pts+=2; } });
  const list = Object.values(rows); list.forEach(r=>r.fd = r.fw - r.fl);
  return list.sort((x,y)=>y.pts-x.pts || y.fd-x.fd || y.fw-x.fw || x.name.localeCompare(y.name));
}
function demoDay(seed){
  const R = rng(seed + 7), skill = {}; DEMO_NAMES.forEach(n=>skill[n] = 0.6 + R());
  const order = shuffle(DEMO_NAMES.slice(), R), late = order.slice(-4);
  const groups = Array.from({length:6},(_,g)=>({ letter:"ABCDEF"[g], players: order.slice(g*5, g*5+5) }));
  const matches = [];
  groups.forEach(g=>{ const p = g.players.concat([null]);
    for (let r=0;r<5;r++){ for (let i=0;i<3;i++){ const a = p[i], b = p[5-i]; if (a && b) matches.push({ id:`${g.letter}${r}${i}`, stage:"G", group:g.letter, round:r+1, a, b, bestOf:3 }); } p.splice(1,0,p.pop()); } });
  const busy = {}, tFree = {}; DEMO_TABLES.forEach(t=>tFree[t]=DEMO_START);
  const dur = bo => bo===3 ? 20 + R()*22 : bo===5 ? 34 + R()*28 : 52 + R()*30;
  function play(m){
    const need = Math.ceil(m.bestOf/2), pa = skill[m.a]/(skill[m.a]+skill[m.b]); let sa = 0, sb = 0; m.brA = []; m.brB = [];
    while (sa<need && sb<need){ const aw = R() < pa; if (aw) sa++; else sb++; const w = aw ? m.brA : m.brB, l = aw ? m.brB : m.brA;
      if (R() < 0.3) w.push(R() < 0.015 ? 100 + Math.floor(R()*38) : 40 + Math.floor(Math.pow(R(),2.4)*62));
      if (R() < 0.07) l.push(40 + Math.floor(Math.pow(R(),2.6)*45)); }
    m.sa = sa; m.sb = sb; m.winner = sa>sb ? m.a : m.b; m.loser = sa>sb ? m.b : m.a;
  }
  function put(m, earliest){ const t = Math.min(...DEMO_TABLES.map(x=>tFree[x])), table = DEMO_TABLES.find(x=>tFree[x]===t);
    m.table = table; m.start = Math.max(t, earliest) + 3; m.end = m.start + dur(m.bestOf); tFree[table] = m.end; busy[m.a] = busy[m.b] = m.end; play(m); }
  const pending = matches.slice(), started = {};
  while (pending.length){
    const t = Math.min(...DEMO_TABLES.map(x=>tFree[x])), ready = pending.filter(m=>(busy[m.a]||0)<=t && (busy[m.b]||0)<=t);
    if (!ready.length){ const table = DEMO_TABLES.find(x=>tFree[x]===t); tFree[table] = Math.min(...pending.map(m=>Math.max(busy[m.a]||0, busy[m.b]||0))); continue; }
    ready.sort((x,y)=>(started[x.group]||0)-(started[y.group]||0) || x.round-y.round);
    const m = ready[0]; pending.splice(pending.indexOf(m),1); started[m.group] = (started[m.group]||0)+1; put(m, t);
  }
  const groupEnd = Math.max(...matches.map(m=>m.end)), finals = groups.map(g=>demoLeague(g, matches, Infinity));
  const byPts = (x,y)=>y.pts-x.pts || y.fd-x.fd || y.fw-x.fw || x.name.localeCompare(y.name);
  const winners = finals.map(t=>t[0]).sort(byPts), seconds = finals.map(t=>t[1]).sort(byPts), thirds = finals.map(t=>t[2]).sort(byPts).slice(0,4);
  const qualified = new Set([...winners, ...seconds, ...thirds].map(r=>r.name));
  const seeds = winners.concat(seconds.slice(0,2)), others = seconds.slice(2).concat(thirds);
  const SEED_SLOTS = [0,15,7,8,4,11,3,12], OPEN = [1,14,6,9,5,10,2,13]; let slots;
  for (let tries=0; tries<300; tries++){ slots = Array(16); seeds.forEach((s,i)=>slots[SEED_SLOTS[i]] = s); const o = shuffle(others.slice(), R); OPEN.forEach((x,i)=>slots[x] = o[i]);
    let ok = true; for (let i=0;i<16;i+=2) if (slots[i].group===slots[i+1].group) ok = false; if (ok) break; }
  const koStart = groupEnd + 20; DEMO_TABLES.forEach(t=>tFree[t] = Math.max(tFree[t], koStart));
  const ko = []; let prev = [];
  for (let i=0;i<8;i++){ const m = { id:"K16-"+i, stage:"K", size:16, slot:i, a:slots[2*i].name, b:slots[2*i+1].name, bestOf:5 }; put(m, koStart); ko.push(m); prev.push(m); }
  for (const size of [8,4,2]){ const next = [];
    for (let i=0;i<size/2;i++){ const f1 = prev[2*i], f2 = prev[2*i+1];
      const m = { id:`K${size}-${i}`, stage:"K", size, slot:i, a:f1.winner, b:f2.winner, from:[f1,f2], bestOf: size===2 ? 7 : 5 };
      put(m, Math.max(f1.end, f2.end) + 5); if (size===2) m.table = DEMO_TABLES[0]; ko.push(m); next.push(m); }
    prev = next; }
  const final = ko[ko.length-1];
  return { seed, groups, matches, ko, groupEnd, koStart, finalEnd: final.end, final, qualified, late };
}
let demoCache = null;
function demoMessage(now){
  const n = Math.floor(now/DEMO_STEP_MS), dayNo = Math.floor(n/DEMO_STEPS), step = n % DEMO_STEPS;
  if (!demoCache || demoCache.seed!==dayNo) demoCache = demoDay(dayNo);
  const d = demoCache, end = d.finalEnd + 1;
  const T = step===0 ? DEMO_START - 20 : step>=DEMO_PLAY ? end + 30 : DEMO_START + 4 + (end - DEMO_START - 4) * (step-1) / (DEMO_PLAY-1);
  const all = d.matches.concat(d.ko), st = m => T>=m.end ? "done" : T>=m.start ? "play" : "wait";
  const known = m => m.stage==="G" || !m.from || m.from.every(f=>T>=f.end);
  const stageOf = m => m.stage==="G" ? `Group ${m.group}` : KO_ONE[m.size];
  const label = t => `Table ${t}`;
  const entries = T < DEMO_START, koOn = T >= d.koStart, over = T >= end;
  const finished = all.filter(m=>st(m)==="done").sort((x,y)=>y.end-x.end);
  const waiting = all.filter(m=>st(m)==="wait" && known(m) && (m.stage==="G" || koOn)).sort((x,y)=>x.start-y.start);
  const groupsDone = T >= d.groupEnd, today = ukDate();
  const msg = { app:"tm-live", format:1, sent: new Date(n*DEMO_STEP_MS).toISOString(),
    event: { id:"demo-masters", comp:"masters", kind:"groups-knockout", name:"Masters Event 2", date: today, venue:"The Red Triangle, Cumbernauld", td:"",
             players: 30, bestOf:3, koBestOf:5, finalBestOf:7, stage: entries ? "entries" : over ? "finished" : koOn ? "knockout" : "groups" },
    players: entries ? { here: DEMO_NAMES.filter(x=>!d.late.includes(x)), coming: d.late.slice() } : { here: DEMO_NAMES.slice() },
    groups: entries ? [] : d.groups.map(g=>({ letter:g.letter, done: d.matches.filter(m=>m.group===g.letter).every(m=>T>=m.end),
      rows: demoLeague(g, d.matches, T).map((r,i)=>({ pos:i+1, name:r.name, p:r.p, w:r.w, l:r.l, pts:r.pts, fd:r.fd, q: groupsDone && d.qualified.has(r.name) })) })),
    results: finished.map(m=>({ id:m.id, stage:stageOf(m), a:m.a, b:m.b, sa:m.sa, sb:m.sb, wo:null, winner:m.winner, at:null })),
    tables: entries || over ? [] : DEMO_TABLES.map(t=>{ const m = all.find(x=>x.table===t && st(x)==="play"); return m ? { label:label(t), status:"play", a:m.a, b:m.b, stage:stageOf(m) } : { label:label(t), status:"free" }; }),
    next: entries || over ? [] : waiting.slice(0,4).map(m=>({ a:m.a, b:m.b, stage:stageOf(m), table: label(m.table) })),
    knockout: !koOn ? null : { size:16, rounds:[16,8,4,2].map(size=>({ name:KO_NAME[size], matches: d.ko.filter(m=>m.size===size).map(m=>{
      const s = st(m), k = known(m), from = f => T>=f.end ? f.winner : null, lab = f => `Winner ${f.size===16?"L16":f.size===8?"QF":"SF"} ${f.slot+1}`;
      const a = k ? m.a : m.from && from(m.from[0]), b = k ? m.b : m.from && from(m.from[1]);
      return { a: a || null, b: b || null, aFrom: a ? undefined : lab(m.from[0]), bFrom: b ? undefined : lab(m.from[1]),
               sa: s==="done" ? m.sa : undefined, sb: s==="done" ? m.sb : undefined, winner: s==="done" ? m.winner : undefined, status: s,
               table: s==="play" || (s==="wait" && k) ? label(m.table) : undefined }; }) })) },
    breaks: finished.flatMap(m=>[...m.brA.map(v=>({ value:v, player:m.a, opponent:m.b, stage:stageOf(m) })), ...m.brB.map(v=>({ value:v, player:m.b, opponent:m.a, stage:stageOf(m) }))]).sort((x,y)=>y.value-x.value).slice(0,50),
    winner: over ? { name:d.final.winner, runnerUp:d.final.loser, score: d.final.winner===d.final.a ? `${d.final.sa}–${d.final.sb}` : `${d.final.sb}–${d.final.sa}` } : null };
  return msg;
}

/* ---------- layout and refreshing ---------- */
function wantTV(){ const v = QS.get("view"); if (v==="tv") return true; if (v==="phone") return false; return innerWidth >= 1100 && innerWidth > innerHeight; }
function fitTV(){ const s = Math.min(innerWidth/1920, innerHeight/1080), tv = $("tv"); tv.style.transform = `scale(${s})`; tv.style.left = ((innerWidth-1920*s)/2)+"px"; tv.style.top = ((innerHeight-1080*s)/2)+"px"; }
function render(){ const isTV = wantTV(); $("phone").hidden = isTV; $("tvbox").hidden = !isTV; if (isTV){ renderTV(); fitTV(); } else renderPhone(); }
$("phone").addEventListener("click", e=>{
  const j = e.target.closest("button[data-jump]");
  if (j){ picked = j.dataset.jump; render(); const el = document.getElementById("ev-" + picked), bar = document.querySelector(".pagebar");
    if (el) scrollTo({ top: el.getBoundingClientRect().top + scrollY - (bar ? bar.offsetHeight : 0) - 8, behavior:"smooth" }); return; }
  const t = e.target.closest("button"); if (!t || !t.dataset.ev) return; const v = view[t.dataset.ev]; if (!v) return;
  if (t.dataset.tab){ v.tab = t.dataset.tab; v.chosen = true; if (v.tab==="ko") v.roundChosen = false; }
  if (t.dataset.round){ v.round = +t.dataset.round; v.roundChosen = true; }
  render();
});
$("tvbox").addEventListener("click", e=>{ const t = e.target.closest("button[data-tvpick]"); if (t){ tvPick = t.dataset.tvpick; render(); } });
addEventListener("resize", render);
(async ()=>{ await load(); render();
  if (DEMO) setInterval(()=>{ const before = JSON.stringify(events.map(m=>m.sent)); load().then(()=>{ if (JSON.stringify(events.map(m=>m.sent))!==before || wantTV()) render(); }); }, 5000);
  else { setInterval(()=>load().then(render), POLL_MS); setInterval(()=>{ if (wantTV()) render(); }, 30000); }
})();
</script>
